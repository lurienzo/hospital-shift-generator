name: Pubblicazione su GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# Permessi minimi: leggere il codice e pubblicare su Pages. Nessuna scrittura
# sul contenuto del repo, e nessun accesso ad altri repository.
permissions:
  contents: read
  pages: write
  id-token: write

# Una pubblicazione per volta. Non annulliamo quella in corso: interromperla a
# metà lascerebbe il sito in uno stato incoerente.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  compilazione:
    runs-on: ubuntu-latest
    steps:
      - name: Scaricamento del codice
        uses: actions/checkout@v4

      - name: Preparazione di Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Installazione delle dipendenze
        run: npm ci

      - name: Controlli
        run: npm run check

      - name: Configurazione di Pages
        uses: actions/configure-pages@v5
        with:
          # Attiva Pages al primo giro, se non è già attivo nelle impostazioni.
          enablement: true

      - name: Compilazione
        run: npm run build
        env:
          # Impronta SHA-256 della password di accesso. Se il segreto non è
          # impostato l'applicazione si apre senza chiedere nulla.
          VITE_APP_PASSWORD_SHA256: ${{ secrets.VITE_APP_PASSWORD_SHA256 }}

      - name: Caricamento del sito compilato
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  pubblicazione:
    needs: compilazione
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Pubblicazione su Pages
        id: deploy
        uses: actions/deploy-pages@v4
